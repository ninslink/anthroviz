<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>AnthroViz</title><link href='https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap' rel='stylesheet'><style>:root{--m:#D12C5B;--l:#e9e9e9}*{box-sizing:border-box}body{margin:0;font-family:Montserrat,sans-serif}.page{max-width:1240px;margin:auto;padding:28px}.menu img{width:150px;cursor:pointer}.nav{display:none}.nav.open{display:grid;grid-template-columns:repeat(3,auto);gap:10px}.grid{display:grid;grid-template-columns:.72fr 1fr 1fr;grid-template-rows:220px 180px 110px 110px;gap:16px}.tile,.newscard{position:relative;border:1px solid var(--l);overflow:hidden;text-decoration:none;color:#111}.tile:before,.newscard:before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,.7)),url(assets/images/header_banner_bw_half.png);background-size:cover;background-position:center;filter:grayscale(1);opacity:.8}.tile:hover:before,.newscard:hover:before{filter:grayscale(1) invert(1)}.tile span,.newscard span{position:absolute;top:18px;left:18px;font-size:11px;letter-spacing:.24em;z-index:2}.about{grid-column:2/4;grid-row:1}.news{grid-row:1/5;display:grid;grid-template-rows:repeat(4,1fr);gap:10px;padding:10px}.research{grid-column:2/4}.footer{margin-top:38px;padding-top:14px;border-top:1px solid var(--l);display:flex;justify-content:space-between;align-items:center}.left{display:flex;align-items:center;gap:10px;font-size:8px;letter-spacing:.18em}.logos{display:flex;gap:24px}.logos img{filter:grayscale(1);opacity:.7;height:20px}.irps{height:26px!important}.bridge{height:13px!important}@media(max-width:820px){.grid{grid-template-columns:1fr}.about,.research,.news{grid-column:auto;grid-row:auto}}</style></head><body><div class='page'><div class='menu'><img id='logo' src='assets/logos/av-mono_bw@3x.png'><nav id='nav' class='nav'><a>ABOUT</a><a>RESEARCH</a><a>PUBLICATIONS</a><a>NEWS</a></nav></div><div class='grid'><div class='tile news'><a class='newscard'><span>TAG MEETING</span></a><a class='newscard'><span>FIELD VALIDATION</span></a><a class='newscard'><span>MAHARASHTRA PILOT</span></a><a class='newscard'><span>AI PIPELINE</span></a></div><a class='tile about'><span>ABOUT</span></a><a class='tile research'><span>RESEARCH</span></a><a class='tile'><span>PUBLICATIONS</span></a><a class='tile'><span>DASHBOARD</span></a><a class='tile'><span>PEOPLE</span></a><a class='tile'><span>RESOURCES</span></a></div><div class='footer'><div class='left'><img src='assets/logos/av-mono_bw@3x.png' height='18'><a style='text-decoration:none;color:#666'>FOR INQUIRIES · AIMM@IHEID.CH</a></div><div class='logos'><img class='irps' src='assets/logos/originals/logo_IRPS.png'><img src='assets/logos/originals/flame-original.png'><img src='assets/logos/originals/snsf-original.png'><img class='bridge' src='assets/logos/originals/bridge-original.png'></div></div></div><script>logo.onclick=()=>nav.classList.toggle('open')</script></body></html>
