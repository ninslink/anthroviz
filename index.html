<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>AnthroViz</title><link rel='icon' href='assets/logos/av-mono_bw@3x.png'><link href='https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap' rel='stylesheet'><style>:root{--m:#D12C5B;--l:#e9e9e9}*{box-sizing:border-box}body{margin:0;font-family:Montserrat,sans-serif}.page{max-width:1260px;margin:auto;padding:28px}.menu img{width:150px;cursor:pointer}.nav{display:none}.nav.open{display:grid;grid-template-columns:repeat(3,auto);gap:10px 18px;margin-top:10px}.grid{display:grid;grid-template-columns:.7fr 1fr 1fr;grid-template-rows:240px 180px 96px 96px;gap:18px;margin-top:18px}.tile{position:relative;border:1px solid var(--l);overflow:hidden}.tile:before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.7)),url(assets/images/header_banner_bw_half.png);background-size:70%;background-position:center;filter:grayscale(1)}.tile:hover:before{filter:grayscale(1) invert(1)}.tile span{position:absolute;top:18px;left:18px;font-size:11px;letter-spacing:.24em}.about{grid-column:2/4;grid-row:1}.news{grid-row:1/5}.research{grid-column:2/4}.footer{display:flex;justify-content:space-between;border-top:1px solid var(--l);margin-top:36px;padding-top:14px}.irps{height:26px}.bridge{height:13px}@media(max-width:820px){.grid{grid-template-columns:1fr;grid-template-rows:220px repeat(6,140px)}.about,.news,.research{grid-column:auto;grid-row:auto}}</style></head><body><div class='page'><div class='menu'><img id='logo' src='assets/logos/av-mono_bw@3x.png'><nav id='nav' class='nav'><a>ABOUT</a><a>RESEARCH</a><a>PUBLICATIONS</a><a>PEOPLE</a><a>NEWS</a><a>DASHBOARD</a></nav></div><div class='grid'><a class='tile about'><span>ABOUT</span></a><a class='tile news'><span>NEWS</span></a><a class='tile research'><span>RESEARCH</span></a><a class='tile'><span>PUBLICATIONS</span></a><a class='tile'><span>DASHBOARD</span></a><a class='tile'><span>PEOPLE</span></a><a class='tile'><span>RESOURCES</span></a></div><div class='footer'><div><img src='assets/logos/av-mono_bw@3x.png' height='18'> FOR INQUIRIES · AIMM@IHEID.CH</div><div><img class='irps' src='assets/logos/originals/logo_IRPS.png'><img class='bridge' src='assets/logos/originals/bridge-original.png'></div></div></div><script>logo.onclick=()=>nav.classList.toggle('open')</script></body></html>
