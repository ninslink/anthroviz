<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><link href='https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap' rel='stylesheet'><style>:root{--m:#D12C5B;--l:#ececec}body{margin:0;background:#f8f8f8;font-family:Montserrat}.page{max-width:1380px;margin:auto;padding:36px}*{box-sizing:border-box}.hero{height:170px;border:1px solid var(--l);margin-bottom:14px;overflow:hidden}.hero img{width:100%;height:100%;object-fit:cover;filter:grayscale(1);transition:.55s}.hero:hover img{filter:grayscale(1) invert(10%) sepia(90%) saturate(2200%) hue-rotate(315deg)}.layout{display:grid;grid-template-columns:80px 280px 1fr;gap:18px}.mono img{width:68px;cursor:pointer}.content{display:grid;gap:14px}.tile{position:relative;border:1px solid var(--l);overflow:hidden}.tile img{width:100%;height:100%;object-fit:cover;object-position:center;filter:grayscale(1) contrast(.92);transition:all .55s cubic-bezier(.2,.8,.2,1)}.tile:hover img{filter:grayscale(1) invert(12%) sepia(85%) saturate(2800%) hue-rotate(320deg) brightness(.95)}.about img{object-fit:contain;background:#f4f4f4}.tiles4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.footer{margin-top:28px;padding:22px 12px;border-top:1px solid var(--l);display:flex;justify-content:space-between;max-width:1280px}.logos img{height:24px;filter:grayscale(1);margin-left:22px}span{position:absolute;top:18px;left:18px;color:var(--m)}</style></head><body><div class='page'><div class='hero'><img src='assets/images/header_banner_bw_half.png'></div><div class='layout'><div class='mono'><img onclick='nav.style.display=(nav.style.display=="flex"?"none":"flex")' src='assets/logos/av-mono_bw@3x.png'><div id='nav' style='display:none;flex-direction:column'>ABOUT NEWS PUBLICATIONS</div></div><div class='news'>NEWS</div><div class='content'><div class='tile about' style='height:300px'><img src='assets/images/pose_silhouette.png'><span>ABOUT</span></div><div class='tile' style='height:220px'><img src='assets/images/landing_refined_04.jpg'><span>RESEARCH</span></div><div class='tiles4'><div class='tile'><img src='assets/images/landing_refined_05.jpg'><span>PUBLICATIONS</span></div><div class='tile'><img src='assets/images/landing_refined_02.jpg'><span>PEOPLE</span></div><div class='tile'><img src='assets/images/landing_refined_03.jpg'><span>RESOURCES</span></div><div class='tile'><img src='assets/images/landing_refined_01.jpg'><span>DASHBOARD</span></div></div></div></div><div class='footer'><div>FOR INQUIRIES · anthroviz@graduateinstitute.ch</div><div class='logos'><img src='assets/logos/originals/logo_IRPS.png'><img src='assets/logos/originals/bridge-original.png'></div></div></div></body></html>
