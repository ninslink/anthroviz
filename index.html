<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AIMM</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:Montserrat,sans-serif;background:#fff;color:#0F1113;overflow:hidden} .footer-right img{height:44px;width:auto;object-fit:contain;filter:grayscale(100%) brightness(.45) contrast(1.02);opacity:.9}.footer-right img.irps-logo{height:44px;width:auto;object-fit:contain;filter:none;opacity:1}@media(max-width:1100px){body{overflow:auto}.page-wrap{display:block;padding:26px 20px 120px}.menu-trigger{top:24px;left:26px}.menu-trigger img{width:62px}.dropdown{top:96px;left:26px}.layout-group{width:min(88vw,760px);gap:20px;margin-top:0}.hero{height:135px}.hero img{width:min(96vw,900px)}.collage{display:flex;flex-direction:column;height:auto;gap:16px}.tile{min-height:220px}footer{position:relative;left:auto;transform:none;width:min(88vw,760px);flex-direction:column;align-items:flex-start;gap:22px;padding:20px 0}.footer-right{justify-content:flex-start;flex-wrap:wrap;gap:22px}}@media(max-width:640px){.hero{height:110px}.hero img{width:94vw}}</style></head><body><section class="collage"></section></body></html>
