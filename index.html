<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>AnthroViz</title><link href='https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap' rel='stylesheet'><style>:root{--m:#D12C5B;--l:#e8e8e8}*{box-sizing:border-box}body{margin:0;font-family:Montserrat,sans-serif;background:#fafafa}.page{max-width:1500px;margin:auto;padding:24px}.layout{display:grid;grid-template-columns:90px 290px 1fr;gap:14px}.sidebar,.news,.content,.footer{border:1px solid var(--l)}.sidebar{display:flex;flex-direction:column;align-items:center;padding:18px;gap:30px}.sidebar img{width:60px}.content{display:grid;grid-template-rows:310px 280px 230px;gap:12px;border:none}.top,.mid,.bottom{display:grid;gap:12px}.top{grid-template-columns:1fr}.mid{grid-template-columns:1fr}.bottom{grid-template-columns:repeat(4,1fr)}.tile{position:relative;overflow:hidden;border:1px solid var(--l);min-height:100%}.tile:before{content:'';position:absolute;inset:0;background:url(assets/images/header_banner_bw_half.png) center/cover;filter:grayscale(1);transition:.35s}.tile:hover:before{filter:invert(12%) sepia(87%) saturate(2800%) hue-rotate(315deg) brightness(95%)}.tile span{position:absolute;top:18px;left:18px;color:var(--m);z-index:2}.news{padding:18px}.footer{margin-top:18px;padding:16px;display:flex;justify-content:space-between;align-items:center}.logos img{height:24px;filter:grayscale(1)}@media(max-width:900px){.layout{grid-template-columns:1fr}.bottom{grid-template-columns:1fr 1fr}}</style></head><body><div class='page'><div class='layout'><div class='sidebar'><img src='assets/logos/av-mono_bw@3x.png'><div>☰<br>MENU</div></div><div class='news'>NEWS</div><div class='content'><div class='top'><div class='tile'><span>ABOUT</span></div></div><div class='mid'><div class='tile'><span>RESEARCH</span></div></div><div class='bottom'><div class='tile'><span>PUBLICATIONS</span></div><div class='tile'><span>PEOPLE</span></div><div class='tile'><span>RESOURCES</span></div><div class='tile'><span>DASHBOARD</span></div></div></div></div><div class='footer'><img src='assets/logos/av-mono_bw@3x.png' height='24'><div class='logos'><img src='assets/logos/originals/logo_IRPS.png'></div></div></div></body></html>
