<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AIMM</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{box-sizing:border-box}

body{
margin:0;
font-family:Montserrat,sans-serif;
background:#fff;
color:#0F1113;
overflow:hidden;
}

.page-wrap{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:18px 42px 104px;
position:relative;
}

.menu-trigger{
position:fixed;
top:34px;
left:72px;
z-index:3000;
cursor:pointer;
}

.menu-trigger img{
width:78px;
filter:grayscale(100%) brightness(0);
transition:.18s;
}

.dropdown{
position:fixed;
top:116px;
left:72px;
background:white;
padding:22px;
display:none;
flex-direction:column;
gap:16px;
z-index:3000;
border:1px solid rgba(0,0,0,.05);
}

.dropdown.open{
display:flex;
}

.dropdown a{
text-decoration:none;
font-size:11px;
letter-spacing:.18em;
color:#111;
text-transform:uppercase;
}

.layout-group{
width:min(63vw,1240px);
display:flex;
flex-direction:column;
align-items:center;
gap:18px;
margin-top:-40px;
}

.hero{
width:100%;
height:175px;
display:flex;
justify-content:center;
align-items:center;
background:white;
margin-bottom:8px;
}

.hero img{
width:min(94vw,1120px);
transition:.2s;
}

.hero:hover img{
filter:
brightness(0)
invert(16%)
sepia(90%)
saturate(6000%)
hue-rotate(328deg)
brightness(92%);
}

.collage{

width:100%;
height:min(640px,66vh);

display:grid;

grid-template-columns:
.92fr
1fr
1fr;

grid-template-rows:
1.22fr
.5fr;

gap:22px;
}

.tile{
position:relative;
overflow:hidden;
background:#f4f4f4;
}

.tile img{
width:100%;
height:100%;
object-fit:cover;
filter:grayscale(100%);
transition:.5s;
}

.tile:hover img{
transform:scale(1.03);
filter:
grayscale(100%)
invert(1)
hue-rotate(305deg);
}

.tile strong{
position:absolute;
left:24px;
top:22px;
color:white;
font-size:24px;
letter-spacing:.14em;
z-index:20;
}

.news{
grid-column:1;
grid-row:1/span 2;
}

.research{
grid-column:2/span 2;
}

.publications{
grid-column:2;
grid-row:2;
}

.dashboard{
grid-column:3;
grid-row:2;
}

.news-overlay{
position:absolute;
inset:0;
padding:24px;
display:flex;
flex-direction:column;
background:linear-gradient(
180deg,
rgba(0,0,0,.1),
rgba(0,0,0,.9)
);
}

.news-overlay strong{
color:white;
font-size:24px;
margin-bottom:28px;
}

.news-list{
display:flex;
flex-direction:column;
gap:12px;
}

.news-item{
padding:14px;
background:rgba(255,255,255,.04);
}

.news-item h4{
margin:0;
color:white;
font-size:12px;
}

footer{

position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);

width:min(63vw,1240px);

display:flex;
justify-content:space-between;
align-items:center;

padding:16px 0;

background:white;

border-top:
1px solid rgba(0,0,0,.05);
}

.footer-left{
display:flex;
gap:18px;
align-items:center;
}

.footer-left img{
height:52px;
object-fit:contain;
}

.footer-right{

display:flex;
gap:34px;
align-items:center;
flex-wrap:wrap;
}

.footer-right img{

height:44px;
object-fit:contain;

filter:
grayscale(100%)
brightness(.45);

max-width:140px;
}

.irps-logo{
filter:none!important;
}

.footer-left a{
color:#111;
text-decoration:none;
}






/* ----------------------- */
/* TABLET */
/* ----------------------- */

@media(max-width:1100px){

body{
overflow:auto;
}

.page-wrap{
display:block;
padding:26px 20px 120px;
}

.menu-trigger{
top:24px;
left:26px;
}

.menu-trigger img{
width:62px;
}

.dropdown{
top:96px;
left:26px;
}

.layout-group{
width:min(88vw,760px);
gap:20px;
margin-top:0;
}

.hero{
height:112px;
padding:0 22px;
}

.hero img{
width:100%;
}

.collage{
display:flex;
flex-direction:column;
height:auto;
gap:18px;
}

.tile{
min-height:230px;
}

footer{

position:relative;

left:auto;
transform:none;

width:min(88vw,760px);

flex-direction:column;

align-items:flex-start;

gap:24px;

padding:24px 0;
}

.footer-right{
justify-content:flex-start;
gap:24px;
}

}




/* ----------------------- */
/* MOBILE */
/* ----------------------- */

@media(max-width:640px){

.hero{
height:96px;
padding:0;
}

.hero img{
width:100%;
}

.layout-group{
width:92vw;
}

.tile{
min-height:200px;
}

.tile strong{
font-size:18px;
}

.news-overlay strong{
font-size:18px;
}

.footer-right img{
height:36px;
}

}

</style>
</head>

<body>

<div class="menu-trigger"
onclick="document.getElementById('dropdown').classList.toggle('open')">

<img src="assets/logos/av-mono_bw@3x.png">

</div>


<nav id="dropdown" class="dropdown">

</nav>



<div class="page-wrap">

<img
src="assets/images/header_banner_bw_half.png"
alt="AnthroViz">

<section class="collage">

</div>

<div class="news-item">

</div>

<div class="news-item">

</div>

<div class="news-item">
<h4>PUBLICATION</h4>
</div>

</div>
</div>
</div>



<a class="tile research" href="project.html">

<img src="assets/images/landing_refined_01.jpg">

</a>



<a class="tile publications"

<img src="assets/images/landing_refined_05.jpg">

<strong>PUBLICATIONS</strong>

</a>



<a class="tile dashboard"
href="dashboard.html">

<img src="assets/images/landing_refined_03.jpg">

<strong>DASHBOARD</strong>

</a>

</section>

</div>
</div>



<footer>

<div class="footer-left">

<img src="assets/logos/av-mono_bw@3x.png">

<div>

For inquiries

<a href="mailto:aimm@iheid.ch">

aimm@iheid.ch

</a>

</div>

</div>


<div class="footer-right">

<img class="irps-logo"
src="assets/logos/originals/IMG_5640.PNG">

<img src="assets/logos/snsf.png">

<img src="assets/logos/bridge.png">

<img src="assets/logos/flame.png">

</div>

</footer>


<script>

document.addEventListener(
'click',

function(e){

const menu =
document.getElementById('dropdown');

const trigger =
e.target.closest('.menu-trigger');

const inside =
e.target.closest('.dropdown');

if(!trigger&&!inside){

menu.classList.remove('open');

}

});

</script>

</body>
</html>
